server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # 1. Routes Angular
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 2. Proxy vers ms-patrimoine (port interne 8080)
  location /api/patrimoines {
    proxy_pass http://ms-patrimoine:8080;
  }

  # 3. Proxy vers ms-circuit (port interne 8081)
  location /api/circuits {
    proxy_pass http://ms-circuit:8081;
  }

  # 4. Proxy vers ms-evenement (port interne 8082)
  location /api/evenements {
    proxy_pass http://ms-evenement:8082;
  }

  # 5. Proxy vers ms-reservation (port interne 8083)
  location /api/reservations {
    proxy_pass http://ms-reservation:8083;
  }
}