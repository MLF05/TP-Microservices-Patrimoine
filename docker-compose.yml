version: '3.8'

services:
  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"
    networks:
      - patrimoine-network

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - patrimoine-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "9090:9090"
    depends_on:
      - eureka-server
      - config-server
    networks:
      - patrimoine-network

  ms-patrimoine:
    build: ./ms-patrimoine
    container_name: ms-patrimoine
    depends_on:
      - eureka-server
      - config-server
    networks:
      - patrimoine-network

  ms-circuit:
    build: ./ms-circuit
    container_name: ms-circuit
    depends_on:
      - eureka-server
      - config-server
    networks:
      - patrimoine-network

  ms-evenement:
    build: ./ms-evenement
    container_name: ms-evenement
    depends_on:
      - eureka-server
      - config-server
    networks:
      - patrimoine-network

  ms-reservation:
    build: ./ms-reservation
    container_name: ms-reservation
    depends_on:
      - eureka-server
      - config-server
    networks:
      - patrimoine-network

  frontend:
    build: ./frontend-patrimoine
    container_name: frontend-patrimoine
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks:
      - patrimoine-network

networks:
  patrimoine-network:
    driver: bridge