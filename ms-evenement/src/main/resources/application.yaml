spring:
  application:
    name: ms-evenement
  config:
    import: optional:configserver:http://config-server:8888
  cloud:
    config:
      retry:
        initial-interval: 1000
        max-attempts: 10
        max-interval: 2000
        multiplier: 1.5

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true